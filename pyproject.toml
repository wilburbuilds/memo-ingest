[project]
name = "memo-ingest"
version = "1.0.0"
description = "Watch Voice Memos on this Mac, transcribe them locally, and write Obsidian notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-whisper"]

[project.scripts]
memo-ingest = "memo_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
